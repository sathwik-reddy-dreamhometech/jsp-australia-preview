<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" width="360" height="88"
     role="img" aria-label="Jana Sena Party Australia">
  <title>Jana Sena Party Australia</title>

  <!--
    PLACEHOLDER WORDMARK.

    Replace this file with the official JanaSena logotype supplied by the
    party. Never redraw the JanaSena mark by hand — and do not ship any
    version of it until written permission to use the party name, logo and
    flag on an Australian domain is on file. PLAN.md §1 and §9.

    Keep the same viewBox and the 5px flag stripe so the masthead layout
    does not shift when the real asset drops in.
  -->

  <!-- flag motif: red / black diagonal -->
  <defs>
    <pattern id="flag" width="44" height="44" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="22" height="44" fill="#EB1C24"/>
      <rect x="22" width="22" height="44" fill="#030303"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="6" height="88" fill="url(#flag)"/>

  <text x="22" y="40"
        font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
        font-size="34" font-weight="700" letter-spacing="0.5"
        fill="#FFFFFF">JANA SENA <tspan fill="#EB1C24">PARTY</tspan></text>

  <text x="23" y="66"
        font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
        font-size="15" font-weight="600" letter-spacing="6.5"
        fill="#EB1C24">AUSTRALIA</text>

  <text x="23" y="84"
        font-family="'Noto Sans Telugu', sans-serif"
        font-size="13" fill="#D0D0D0">జనసేన పార్టీ</text>
</svg>
